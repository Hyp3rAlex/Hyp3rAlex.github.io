name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so repository metadata stays reasonably fresh (Mondays 05:17 UTC).
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Refresh repository metadata (falls back to the committed snapshot)
        run: npm run metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Link check
        run: npm run check:links -- --allow-pending https://github.com/Hyp3rAlex/Hyp3rAlex.github.io
      - name: End-to-end tests (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
