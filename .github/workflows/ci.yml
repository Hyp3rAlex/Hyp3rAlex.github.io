name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Link check
        run: npm run check:links -- --allow-pending https://github.com/Hyp3rAlex/Hyp3rAlex.github.io
      - name: End-to-end tests (Chromium, Firefox, WebKit; desktop and mobile emulation)
        run: |
          npx playwright install --with-deps
          npm run test:e2e
